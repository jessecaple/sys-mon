[package]
name = "sys-mon"
version = "0.1.0"
edition = "2024"
description = "A native GNOME resource monitor"
license = "MIT"
repository = "https://github.com/jessecaple/sys-mon"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
gtk = { version = "0.11.3", package = "gtk4", features = ["v4_12"] }
libc = "0.2"
libloading = "0.8"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
